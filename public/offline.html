<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Offline — MeD Miracle</title>
    <style>
        :root {
            --teal: #0f766e;
            --ink: #0f172a;
            --muted: #64748b;
            --bg: #f0fdfa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(15, 118, 110, 0.18), transparent),
                linear-gradient(165deg, #ffffff 0%, var(--bg) 100%);
        }
        .card {
            width: min(100%, 24rem);
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .mark {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 1.15rem;
            background: #fff;
            box-shadow: 0 10px 30px rgba(15, 118, 110, 0.15);
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .mark img { width: 100%; height: 100%; object-fit: cover; }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.95rem;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #0f766e 0%, #0ea5e9 100%);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(15, 118, 110, 0.25);
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">
            <img src="/icons/icon-192.png" alt="MeD Miracle" width="72" height="72">
        </div>
        <h1>You're offline</h1>
        <p>MeD Miracle needs an internet connection for live care data. Reconnect, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
